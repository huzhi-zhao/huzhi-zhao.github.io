<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1116"/>
      <stop offset="1" stop-color="#141a22"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.03"/>
    </pattern>
    <radialGradient id="glow" cx="0.22" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- wordmark -->
  <text x="86" y="140" font-size="84" font-weight="700" letter-spacing="-2">
    <tspan fill="#e7ebe9">Toucan</tspan><tspan fill="#a78bfa">Shelf</tspan>
  </text>
  <path d="M92 168 H716" stroke="#a78bfa" stroke-width="2" opacity="0.55"/>

  <!-- ============ left column ============ -->
  <text x="92" y="228" font-size="25" fill="#a78bfa" letter-spacing="1">Hierarchical Knowledge Base</text>

  <g stroke-linecap="round">
    <g transform="translate(96,254)">
      <path d="M0 0 h14 l4 6 h16 v20 H0 Z" fill="none" stroke="#8b95a1" stroke-width="2"/>
      <text x="48" y="20" font-size="23" fill="#c7cfd6">SideProjects</text>
    </g>
    <g transform="translate(126,294)">
      <path d="M-18 -14 V12 h14" fill="none" stroke="#3a444f" stroke-width="1.6"/>
      <path d="M0 0 h14 l4 6 h16 v20 H0 Z" fill="none" stroke="#8b95a1" stroke-width="2"/>
      <text x="48" y="20" font-size="23" fill="#c7cfd6">UOIP</text>
    </g>
    <g transform="translate(156,334)">
      <path d="M-18 -14 V12 h14" fill="none" stroke="#3a444f" stroke-width="1.6"/>
      <path d="M0 0 h14 l4 6 h16 v20 H0 Z" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa" stroke-width="2"/>
      <text x="48" y="20" font-size="23" fill="#a78bfa">events</text>
    </g>
    <g transform="translate(186,374)">
      <path d="M-18 -14 V12 h14" fill="none" stroke="#3a444f" stroke-width="1.6"/>
      <path d="M2 0 h26 v22 H2 Z" fill="none" stroke="#6b7681" stroke-width="2"/>
      <path d="M8 8 h14 M8 14 h14" stroke="#6b7681" stroke-width="1.6"/>
      <text x="48" y="20" font-size="23" fill="#8b95a1">2026-02-11</text>
    </g>
  </g>

  <text x="92" y="452" font-size="25" fill="#a78bfa" letter-spacing="1">Notion-Like Gallery View</text>
  <g fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="2">
    <rect x="92"  y="474" width="86" height="46" rx="5"/>
    <rect x="194" y="474" width="86" height="46" rx="5"/>
    <rect x="296" y="474" width="86" height="46" rx="5"/>
    <rect x="398" y="474" width="86" height="46" rx="5"/>
    <rect x="92"  y="534" width="86" height="46" rx="5"/>
    <rect x="194" y="534" width="86" height="46" rx="5"/>
    <rect x="296" y="534" width="86" height="46" rx="5"/>
    <rect x="398" y="534" width="86" height="46" rx="5"/>
  </g>

  <!-- ============ right column ============ -->
  <rect x="556" y="210" width="556" height="370" rx="10" fill="#ffffff" fill-opacity="0.015" stroke="#3a444f" stroke-width="2"/>

  <!-- draw.io -->
  <g transform="translate(588,244)">
    <rect x="0" y="2" width="22" height="18" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <rect x="28" y="26" width="22" height="18" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <path d="M22 11 H39 V26" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="84" y="20" font-size="27" fill="#c7cfd6">Draw.io Diagram</text>
    <text x="84" y="44" font-size="20" fill="#6b7681">SVG With Embedded XML</text>
  </g>

  <!-- publish as blog -->
  <g transform="translate(588,332)">
    <rect x="0" y="2" width="38" height="44" rx="3" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <path d="M8 14 h22 M8 24 h22 M8 34 h13" stroke="#a78bfa" stroke-width="2" opacity="0.75"/>
    <path d="M40 30 h14 m0 0 l-6 -6 m6 6 l-6 6" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="84" y="20" font-size="27" fill="#c7cfd6">Publish As A Blog</text>
    <text x="84" y="44" font-size="20" fill="#6b7681">One Document, One Public Site</text>
  </g>

  <!-- obsidian-like editing -->
  <g transform="translate(588,420)">
    <rect x="0" y="2" width="52" height="44" rx="3" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <path d="M9 15 h20 M9 26 h34 M9 37 h16" stroke="#a78bfa" stroke-width="2" opacity="0.75"/>
    <rect x="32" y="10" width="12" height="10" fill="#a78bfa" fill-opacity="0.5"/>
    <text x="84" y="20" font-size="27" fill="#c7cfd6">Obsidian-Like Editing</text>
    <text x="84" y="44" font-size="20" fill="#6b7681">Rich Blocks, Live Rendering</text>
  </g>

  <!-- encrypted knowledge -->
  <g transform="translate(588,508)">
    <rect x="-8" y="-4" width="66" height="56" rx="6" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 6" opacity="0.55"/>
    <rect x="9" y="20" width="32" height="24" rx="3" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <path d="M16 20 V12 a9 9 0 0 1 18 0 V20" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="84" y="20" font-size="27" fill="#c7cfd6">Encrypted Knowledge</text>
    <text x="84" y="44" font-size="20" fill="#6b7681">Client-Side Crypto</text>
  </g>

  <!-- ============ bottom strip ============ -->
  <path d="M92 610 H1112" stroke="#3a444f" stroke-width="1.5"/>
  <g font-size="24" letter-spacing="1">
    <text x="92" y="650" fill="#a78bfa">AI Collaboration · <tspan fill="#e7ebe9" font-weight="700">MCP + Git</tspan></text>
    <text x="640" y="650" fill="#6b7681">Hybrid FTS + Vector Search</text>
  </g>
</svg>
