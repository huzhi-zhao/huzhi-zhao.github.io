<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="UOIP: 311 reports, plow shift schedule and weather merge into discrete snow events, producing a per-zone operational load ranking">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1712"/>
      <stop offset="1" stop-color="#111110"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5b942" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#f5b942" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0.5 L9 5 L0 9.5" fill="none" stroke="#f5b942" stroke-opacity="0.55" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <ellipse cx="640" cy="420" rx="560" ry="230" fill="url(#glow)"/>

  <!-- wordmark -->
  <g transform="translate(0,-44)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <text x="88" y="172" font-size="60" font-weight="700" letter-spacing="1" fill="#f5b942">Snowfall</text>
    <text x="88" y="244" font-size="60" font-weight="700" letter-spacing="1" fill="#e7ebe9">Service Ranking</text>
    <text x="400" y="170" font-size="54" fill="#f5b942" fill-opacity="0.55">→</text>
    <path d="M92 272 H700" stroke="#f5b942" stroke-opacity="0.3" stroke-width="3"/>
    <text x="92" y="308" font-size="21" letter-spacing="1.2" fill="#7d8985">Winnipeg Winter Operations</text>
  </g>

  <!-- inputs -->
  <g transform="translate(0,-18)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" fill="#c9d1ce">
    <g>
      <rect x="94" y="358" width="14" height="14" rx="2.5" fill="#f5b942"/>
      <text x="124" y="371">311 Reports</text>
      <path d="M300 365 C 350 365, 356 440, 404 440" fill="none" stroke="#f5b942" stroke-opacity="0.35" stroke-width="2"/>
    </g>
    <g>
      <rect x="94" y="428" width="14" height="14" rx="2.5" fill="none" stroke="#f5b942" stroke-opacity="0.7" stroke-width="2"/>
      <text x="124" y="441">Shift Schedule</text>
      <path d="M320 435 H404" fill="none" stroke="#f5b942" stroke-opacity="0.35" stroke-width="2"/>
    </g>
    <g>
      <rect x="94" y="498" width="14" height="14" rx="2.5" fill="none" stroke="#8e9c97" stroke-opacity="0.5" stroke-width="2"/>
      <text x="124" y="511">Weather</text>
      <path d="M262 505 C 320 505, 340 440, 404 440" fill="none" stroke="#f5b942" stroke-opacity="0.35" stroke-width="2"/>
    </g>
  </g>

  <!-- snow event window -->
  <g transform="translate(0,-18)">
    <circle cx="410" cy="440" r="7" fill="#f5b942"/>
    <path d="M410 440 H812" stroke="#f5b942" stroke-opacity="0.55" stroke-width="2" marker-end="url(#tip)" fill="none"/>
    <rect x="452" y="336" width="266" height="104" rx="6" fill="#f5b942" fill-opacity="0.05" stroke="#f5b942" stroke-opacity="0.3" stroke-width="1.6" stroke-dasharray="6 6"/>
    <text x="585" y="486" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" letter-spacing="1.2" fill="#9aa5a1">Snow Event</text>
    <g stroke="#f5b942" stroke-opacity="0.6" stroke-width="7" stroke-linecap="round">
      <path d="M472 438 V416"/><path d="M496 438 V398"/><path d="M520 438 V370"/>
      <path d="M544 438 V352"/><path d="M568 438 V378"/><path d="M592 438 V404"/>
      <path d="M616 438 V386"/><path d="M640 438 V420"/><path d="M664 438 V430"/>
      <path d="M688 438 V424"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="2">
      <path d="M740 432v16M764 432v16M788 432v16"/>
    </g>
  </g>

  <!-- per-zone ranking -->
  <g transform="translate(0,-18)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <text x="860" y="308" font-size="20" letter-spacing="1.2" fill="#9aa5a1">Zone Load Score</text>
    <g font-size="19" fill="#7d8985">
      <text x="860" y="354">Z-14</text><rect x="930" y="338" width="188" height="19" rx="3" fill="#f5b942" fill-opacity="0.92"/>
      <text x="860" y="396">Z-07</text><rect x="930" y="380" width="154" height="19" rx="3" fill="#f5b942" fill-opacity="0.72"/>
      <text x="860" y="438">Z-22</text><rect x="930" y="422" width="124" height="19" rx="3" fill="#f5b942" fill-opacity="0.54"/>
      <text x="860" y="480">Z-03</text><rect x="930" y="464" width="92" height="19" rx="3" fill="#f5b942" fill-opacity="0.38"/>
      <text x="860" y="522">Z-18</text><rect x="930" y="506" width="60" height="19" rx="3" fill="#f5b942" fill-opacity="0.24"/>
    </g>
  </g>

  <!-- lakehouse layers -->
  <g transform="translate(0,-22)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" letter-spacing="1.4" fill="#5d6764">
    <path d="M92 600 H432" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
    <text x="92" y="632">Bronze</text>
    <path d="M452 600 H792" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
    <text x="452" y="632">Silver</text>
    <path d="M812 600 H1120" stroke="#f5b942" stroke-opacity="0.28" stroke-width="2"/>
    <text x="812" y="632" fill="#8a7a55">Gold</text>
  </g>
</svg>
